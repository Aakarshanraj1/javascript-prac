<!DOCTYPE html>
<html>
  <head>
    <title>DOM Practice</title>
    <style>
      body{
        font-family: Arial, Helvetica, sans-serif;
      }
      .js-subs {
        margin-bottom: 50px;
        padding: 10px 16px 10px 16px;
        background-color: black;
        color: white;
        font-family: arial;
        font-weight: bold;
        border-radius: 20px;
        border: none;
        transition: 0.2s;
      
      
      }
      .js-subs:hover{
      opacity: 0.8;
      cursor: pointer;

      }
      .js-subs:active{
        opacity: 1;
        background-color: white;
        color: black;
      }
      .js-link{
        text-decoration: underline;
      }
      .js-rpc{
        margin-top: 50px;
      }
      .js-cal-but{
        background-color: green;
        color: white;
        padding: 12px 18px 12px 18px;
        font-family: arial;
        border:none;
        transition: 0.2s;

      }
      .js-input{
        padding: 11px 18px 11px 18px;
      }
      .is-subs{
        background-color: rgb(240, 240, 240);
        color: black;
        
      }
      

      
    </style>
    <body>
      <p>
        YouTube Subscribe Button
      </p>
      <button onclick="
       subscribe();
      " class="js-subs">
        Subscribe
      </button>

      <p>
        Amazon Shipping Calculator
      </p>
      <p>
        Order under $40 = +$10 Shipping
      </p>
      <p>
        Order under $40 = Free Shipping
      </p>
      <input placeholder="Cost of product" class="js-input" onkeydown="costKey(event);">
      <button onclick="
      tax();
      " class="js-cal-but">Calculate</button>
      <p class="js-total"></p>

      <p class="js-rpc">Rock Paper Scissor game</p>
      <a class=".js-link" href="http://127.0.0.1:5500/rock-paper-scissors.html">Click here</a>
     

     <script>
      function costKey(event){
        if (event.key === 'Enter'){
        tax();
       }

      }
      
      function subscribe(){
        const button= document.querySelector('.js-subs');

        if (button.innerText==='Subscribe'){
          button.innerHTML='Subscribed';
          button.classList.add('is-subs');
         
        }
        else{
          button.innerHTML = 'Subscribe';
          button.classList.remove('is-subs');
      
        }

      }
      function tax(){
        const input=document.querySelector('.js-input');
        let cost = Number(input.value);
        if(cost < 40){
          cost = cost + 10;
        }
       
        document.querySelector('.js-total')
          .innerHTML = `$${cost}`;
        
      }
     </script>
    </body>
  </head>

<!DOCTYPE html>
<html>
  <head>
    <title>DOM Practice</title>
    <style>
      .js-subs {
        margin-bottom: 50px;
      }
      .js-link{
        text-decoration: underline;
      }
      .js-rpc{
        margin-top: 50px;
      }
    </style>
    <body>
      <p>
        YouTube Subscribe Button
      </p>
      <button onclick="
       subscribe();
      " class="js-subs">
        Subscribe
      </button>

      <p>
        Amazon Shipping Calculator
      </p>
      <p>
        Order under $40 = +$10 Shipping
      </p>
      <p>
        Order under $40 = Free Shipping
      </p>
      <input placeholder="Cost of product" class="js-input" onkeydown="costKey(event);">
      <button onclick="
      tax();
      ">Calculate</button>
      <p class="js-total"></p>

      <p class="js-rpc">Rock Paper Scissor game</p>
      <a class=".js-link" href="http://127.0.0.1:5500/rock-paper-scissors.html">Click here</a>
     

     <script>
      function costKey(event){
        if (event.key === 'Enter'){
        tax();
       }

      }
      
      function subscribe(){
        const button= document.querySelector('.js-subs');

        if (button.innerText==='Subscribe'){
          button.innerHTML='Subscribed';
        }
        else{
          button.innerHTML = 'Subscribe';
        }

      }
      function tax(){
        const input=document.querySelector('.js-input');
        let cost = Number(input.value);
        if(cost < 40){
          cost = cost + 10;
        }
       
        document.querySelector('.js-total')
          .innerHTML = `$${cost}`;
        
      }
     </script>
    </body>
  </head>

<!DOCTYPE html>
<html>

<head>
  <title>Array loops</title>
</head>

<body>


  <script>
  const aka = [1, 2, 3];
  let sum = 0;
  for (let i = 0; i < aka.length; i++ ){
      sum += aka[i];
  }
  console.log(sum);
  const kak = [];
  
  for(i = 0; i < aka.length ; i++) {
     kak.push(2*aka[i]);

  }
  console.log(kak);
  

  </script>
</body>

</html>

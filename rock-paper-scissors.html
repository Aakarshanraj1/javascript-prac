<!DOCTYPE html>
<html>

<head>
  <title>RPC Game</title>

<body>
  <p>
    Rock Paper Scissors Game
  </p>
  <button onclick="
      pickComputerMove();
      playGame('rock'); ">
    Rock
  </button>

  <button onclick="
      pickComputerMove();
      playGame('paper'); ">
    Paper
  </button>

  <button onclick=" 
      pickComputerMove();
      playGame('scissors');">
    Scissors
  </button>
  <script>
    let ComputerMove = '';
    function pickComputerMove() {
      const randomNumber = Math.random();
      if (randomNumber >= 0 && randomNumber < 1 / 3) {
        ComputerMove = 'Rock';
      } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
        ComputerMove = 'Paper';
      } else {
        ComputerMove = 'Scissors';
      }
    }

    function playGame(playerMove) {
      
      let result = '';
      if (playerMove === 'scissors') {
        
        if (ComputerMove === 'Rock') {
          result = 'You lost.';
        } else if (ComputerMove === 'Paper') {
          result = 'You win.';
        } else {
          result = 'It\'s a tie';
        }
      }
      else if(playerMove === 'rock')
      {
        
        if (ComputerMove === 'Rock') {
          result = 'It\'s a tie';
        } else if (ComputerMove === 'Paper') {
          result = 'You lost';
        } else {
          result = 'You win';
        }
      }
      else if(playerMove === 'paper')
      {
      
        if (ComputerMove === 'Rock') {
          result = 'You win.';
        } else if (ComputerMove === 'Paper') {
          result = 'It\'s a tie.';
        } else {
          result = 'You lost.';
        }
      }
      alert(`You picked ${playerMove}. Computer picked ${ComputerMove}. ${result}`);
    }

  </script>
</body>
</head>

</html>

<!DOCTYPE html>
<html>
  <head>
    <title>RPC Game</title>
    <body>
      <p>
        Rock Paper Scissors Game
      </p>
      <button onclick="
      pickComputerMove();
      Rock(); ">
        Rock
      </button>
      
      <button onclick="
      pickComputerMove();
      Paper(); ">
        Paper
      </button>
     
      <button onclick=" 
      pickComputerMove();
      Scissors();">
        Scissors
      </button>
     <script>
      let ComputerMove='';
      function pickComputerMove(){
      const randomNumber = Math.random();
      if (randomNumber >=0 && randomNumber < 1 / 3){
       ComputerMove ='Rock';
      }else if (randomNumber >=1 / 3 && randomNumber < 2 / 3){
       ComputerMove ='Paper';
      }else {
       ComputerMove ='Scissors';
      }
      }
      function Rock() {


      let result='';
      if(ComputerMove === 'Rock'){
        result ='It\'s a tie';
      }else if(ComputerMove === 'Paper'){
        result ='You lost';
      }else {
        result ='You win';
      }
      alert(`You picked Rock. Computer picked ${ComputerMove}. ${result}`);

      }
      function Paper(){
      

      let result='';
      if(ComputerMove === 'Rock'){
        result ='You win.';
      }else if(ComputerMove === 'Paper'){
        result ='It\'s a tie.';
      }else {
        result ='You lost.';
      }
      alert(`You picked Paper. Computer picked ${ComputerMove}. ${result}`);

      }
      function Scissors(){
     

      let result='';
      if(ComputerMove === 'Rock'){
        result ='You lost.';
      }else if(ComputerMove === 'Paper'){
        result ='You win.';
      }else {
        result ='It\'s a tie';
      }
      alert(`You picked Scissors. Computer picked ${ComputerMove}. ${result}`);
      }
     </script>
    </body>
  </head>
</html>

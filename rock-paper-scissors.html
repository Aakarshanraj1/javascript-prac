
<!DOCTYPE html>
<html>

<head>
  <title>RPC Game</title>

<body>
  <p>
    Rock Paper Scissors Game
  </p>
  <button onclick="
      pickComputerMove();
      playGame('rock'); ">
    Rock
  </button>

  <button onclick="
      pickComputerMove();
      playGame('paper'); ">
    Paper
  </button>

  <button onclick=" 
      pickComputerMove();
      playGame('scissors');">
    Scissors
  </button>

  <button onclick="
    score.Wins = 0;
    score.Losses = 0;
    score.Ties = 0;
    alert(`The score is reset \nWins : ${score.Wins} , Losses : ${ score.Losses} , Ties : ${score.Ties}`);
  ">Reset Score</button>
  <script>
    let ComputerMove = '';
    const score = JSON.parse(localStorage.getItem('score')) || {Wins : 0, Losses : 0 , Ties : 0};
     
    
    function pickComputerMove() {
      const randomNumber = Math.random();
      if (randomNumber >= 0 && randomNumber < 1 / 3) {
        ComputerMove = 'Rock';
      } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
        ComputerMove = 'Paper';
      } else {
        ComputerMove = 'Scissors';
      }
    }

    function playGame(playerMove) {

      
      let result = '';
      if (playerMove === 'scissors') {
        
        if (ComputerMove === 'Rock') {
          result = 'You lost.';
          
        } else if (ComputerMove === 'Paper') {
          result = 'You win.';
      
        } else {
          result = 'It\'s a tie.';
      
        }
      }
      else if(playerMove === 'rock')
      {
        
        if (ComputerMove === 'Rock') {
          result = 'It\'s a tie.';
      
        } else if (ComputerMove === 'Paper') {
          result = 'You lost.';
         
        } else {
          result = 'You win.';
      
        }
      }
      else if(playerMove === 'paper')
      {
      
        if (ComputerMove === 'Rock') {
          result = 'You win.';
      
        } else if (ComputerMove === 'Paper') {
          result = 'It\'s a tie.';
      
        } else {
          result = 'You lost.';
          
        }
      }
      if (result === 'You win.'){
        score.Wins++;
      }else if(result=== 'You lost.'){
        score.Losses++;
      }else if (result=== 'It\'s a tie.') {
        score.Ties++
      }
      localStorage.setItem('score' , JSON.stringify(score));
      alert(`You picked ${playerMove}. Computer picked ${ComputerMove}. ${result}\nWins : ${score.Wins} , Losses : ${score.Losses} , Ties : ${score.Ties}`);
    }

  </script>
</body>
</head>

</html>

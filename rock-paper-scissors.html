
<!DOCTYPE html>
<html>

<head>
  <title>Rock Paper Scissors Game</title>
  <link rel="stylesheet" href="styles/rpc.css">
</head>
<body>
  <p class="title">
    Rock Paper Scissors Game
  </p>
  <button onclick="
      pickComputerMove();
      playGame('rock'); " class="move-button">
   <img src="rpc/rock-emoji.png" >
    
  </button>

  <button onclick="
      pickComputerMove();
      playGame('paper'); " class="move-button">
    <img src="rpc/paper-emoji.png">
  </button>

  <button onclick=" 
      pickComputerMove();
      playGame('scissors');" class="move-button">
    <img src="rpc/scissors-emoji.png">
  </button>
  <p class="js-result"></p>
  <p class="js-pick"></p>
  
  <p class="js-score"></p>

  <button onclick="
    score.Wins = 0;
    score.Losses = 0;
    score.Ties = 0;
   updateScore();
    document.querySelector('.js-result').innerHTML = 'The score resets';
      document.querySelector('.js-pick')
       .innerHTML = ``;
  " class="reset">Reset Score</button>
  <button class="auto-play">Auto Play</button>


  <script src="scripts/rpc.js">

  
  </script>
</body>


</html>
